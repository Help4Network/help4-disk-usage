name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n src/bin/help4-disk-usage-update
          bash -n scripts/package.sh
          bash -n scripts/package-whmcs.sh
          bash -n scripts/build-tutorial-pack.sh
          bash -n tests/backup_policy.sh
          bash -n tests/whmcs_package.sh

      - name: Perl syntax
        run: |
          perl -c src/bin/help4-disk-usage-scan
          perl -c src/whm/index.cgi
          PERL5LIB=tests/lib perl -c src/cpanel/index.live.pl

      - name: PHP syntax
        run: |
          php -l integrations/whmcs/modules/addons/help4_disk_usage/help4_disk_usage.php
          php -l integrations/whmcs/modules/addons/help4_disk_usage/hooks.php
          php -l tests/whmcs_ssh_security.php

      - name: Scanner smoke tests
        run: |
          ./tests/smoke_scanner.sh
          perl tests/scanner_hardening.pl
          perl tests/file_workflows.pl
          perl tests/tree_rankings.pl
          bash tests/updater_channel.sh
          php tests/whmcs_tenant_isolation.php
          ./tests/security_boundaries.sh
          ./tests/backup_policy.sh
          ./tests/branding_update_contract.sh
          ./tests/request_security.sh
          ./tests/whmcs_package.sh
          php tests/whmcs_ssh_security.php

      - name: Build release packages
        run: |
          ./scripts/package.sh
          ./scripts/package-whmcs.sh

      - name: Set up browser test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Browser workflow tests
        run: |
          npm install --prefix "$RUNNER_TEMP/h4du-ui" --no-save playwright@1.54.1
          "$RUNNER_TEMP/h4du-ui/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/h4du-ui/node_modules" node tests/browser_workflows.js
